name: Update Stargazers

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stargazers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch stargazers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stargazers.js

      - name: Commit STARGAZERS.md if changed
        run: |
          git config user.name "Давид"
          git config user.email "davyd.kohut@gmail.com"
          git add STARGAZERS.md
          git diff --staged --quiet || git commit -m "STARGAZERS.md"
          git push
