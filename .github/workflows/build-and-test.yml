name: Build and Test

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [
            # linux-x86_64,
            # linux-aarch64,
            # macos-x86_64,
            # macos-aarch64,
            windows-x86_64,
            # windows-aarch64,
            # android-aarch64,
            # wasm64,
          ]
        mode: [debug, release]
        exclude:
          - mode: ${{ github.ref_name == 'main' && 'debug' || 'release' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang llvm lld make cmake ninja-build xz-utils curl unzip wget git patch python3 python-is-python3 libssl-dev lzma-dev libxml2-dev bzip2 cpio libbz2-dev zlib1g-dev bash build-essential libc6-dev-arm64-cross linux-libc-dev-arm64-cross gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-arm64-cross qemu-user-static
          version: v5

      - name: Install Wine and Darling for tests
        if: matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64
          if [ "${{ matrix.platform }}" = "macos-x86_64" ]; then
            sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 4B7C1C1D || true
            echo "deb https://repo.darlinghq.org/ /" | sudo tee /etc/apt/sources.list.d/darling.list
            sudo apt-get update
            sudo apt-get install -y darling || echo "Darling installation failed. macOS tests will be skipped."
          fi

      - name: Fix aarch64 cross-compiler sysroot paths
        if: matrix.platform == 'linux-aarch64'
        run: |
          # lld looks for /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu/lib/libc.so.6
          # We create a symlink so lld can resolve the absolute paths inside the libc.so linker script
          sudo mkdir -p /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu
          sudo ln -s /usr/aarch64-linux-gnu/lib /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu/lib

      - name: Test aarch64 cross-compiler
        if: matrix.platform == 'linux-aarch64'
        run: |
          echo 'int main() { return 0; }' > test.c
          /usr/bin/clang --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu -fuse-ld=lld -g -O0 test.c -o test
          echo "Cross-compiler test passed!"

      - name: Cache tsil compiler
        id: cache-tsil
        uses: actions/cache@v4
        with:
          path: tsil-cache
          key: tsil-${{ hashFiles('ЦІЛЬ') }}

      - name: Download and install tsil compiler tool
        run: |
          if [ ! -d "tsil-cache" ]; then
            TSIL_VERSION=$(cat ЦІЛЬ | xargs)
            URL="https://github.com/tsil-ukr/files/raw/main/випуски-цілі/${TSIL_VERSION}/ціль-${TSIL_VERSION}-лінукс-ікс86_64.tar.xz"
            curl -L "$URL" -o tsil.tar.xz
            tar -xf tsil.tar.xz
            mv "ціль-${TSIL_VERSION}-лінукс-ікс86_64" tsil-cache
            rm -rf tsil.tar.xz
          fi
          sudo cp "tsil-cache/програми/ціль" /usr/local/bin/ціль
          sudo chmod +x /usr/local/bin/ціль

      - name: Cache llvm-mingw
        id: cache-mingw
        if: startsWith(matrix.platform, 'windows-')
        uses: actions/cache@v4
        with:
          path: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          key: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64

      - name: Setup Windows cross-compilation (llvm-mingw)
        if: startsWith(matrix.platform, 'windows-')
        run: |
          MINGW_DIR="llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64"
          if [ ! -d "$MINGW_DIR" ]; then
            MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz"
            curl -L "$MINGW_URL" -o mingw.tar.xz
            tar -xf mingw.tar.xz
            rm -f mingw.tar.xz
          fi
          echo "LLVM_MINGW_PATH=$PWD/$MINGW_DIR" >> $GITHUB_ENV

      - name: Cache Android NDK
        id: cache-ndk
        if: matrix.platform == 'android-aarch64'
        uses: actions/cache@v4
        with:
          path: android-ndk-r27d
          key: android-ndk-r27d

      - name: Setup Android cross-compilation (NDK)
        if: matrix.platform == 'android-aarch64'
        run: |
          NDK_DIR="android-ndk-r27d"
          if [ ! -d "$NDK_DIR" ]; then
            curl -L "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip" -o ndk.zip
            unzip -q ndk.zip
            rm -f ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$PWD/$NDK_DIR" >> $GITHUB_ENV

      - name: Cache osxcross
        id: cache-osxcross
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/cache@v4
        with:
          path: osxcross
          key: osxcross-MacOSX14.5-v2

      - name: Setup MacOS cross-compilation (osxcross)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          if [ ! -d "osxcross/target" ]; then
            git clone https://github.com/tpoechtrager/osxcross.git
            curl -L "https://github.com/roblabla/MacOSX-SDKs/releases/download/macosx14.5/MacOSX14.5.sdk.tar.xz" \
              -o osxcross/tarballs/MacOSX14.5.sdk.tar.xz

            cd osxcross
            UNATTENDED=1 ./build.sh
            cd ..
          fi

          # osxcross uses 'arm64' instead of 'aarch64'. Create symlinks to satisfy build.sh
          if [ "${{ matrix.platform }}" = "macos-aarch64" ]; then
            cd osxcross/target/bin
            for ext in clang clang++ ar ranlib rc; do
              ln -sf arm64-apple-darwin23-$ext aarch64-apple-darwin23-$ext
            done
            cd -
          fi

          echo "OSXCROSS_PATH=$PWD/osxcross/target" >> $GITHUB_ENV

      - name: Download project libraries
        run: |
          chmod +x scripts/download_libs.sh
          bash scripts/download_libs.sh

      - name: Run compilation
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh \
            "${{ matrix.mode }}" \
            "${{ matrix.platform }}" || (find build -name "config.log" -exec tail -n 200 {} \; && exit 1)

      - name: Run tests
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'linux-aarch64' || matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-x86_64'
        run: |
          chmod +x scripts/test.sh

          VERSION=$(cat ВЕРСІЯ | xargs)

          case "${{ matrix.platform }}" in
            linux-x86_64)    TSIL_FOLDER="лінукс-ікс86_64" ;;
            linux-aarch64)   TSIL_FOLDER="лінукс-аарч64" ;;
            macos-x86_64)    TSIL_FOLDER="макос-ікс86_64" ;;
            windows-x86_64)  TSIL_FOLDER="віндовс-ікс86_64" ;;
          esac

          if [ "${{ matrix.mode }}" = "release" ]; then
            TSIL_MODE="випуск"
          else
            TSIL_MODE="відлагодження"
          fi

          MAVKA_BIN="мавка"
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            MAVKA_BIN="мавка.exe"
          fi

          MAVKA_PATH="будування/${VERSION}/${TSIL_FOLDER}/${TSIL_MODE}/готове/${MAVKA_BIN}"
          ABS_MAVKA_PATH="$PWD/$MAVKA_PATH"

          WRAPPER_PATH="/tmp/mavka_wrapper"
          echo "#!/bin/bash" > $WRAPPER_PATH

          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            echo "wine64 \"$ABS_MAVKA_PATH\" \"\$@\"" >> $WRAPPER_PATH
          elif [ "${{ matrix.platform }}" = "macos-x86_64" ]; then
            if ! command -v darling &> /dev/null; then
              echo "Darling is not installed, skipping macOS tests."
              exit 0
            fi
            echo "darling shell \"$ABS_MAVKA_PATH\" \"\$@\"" >> $WRAPPER_PATH
          elif [ "${{ matrix.platform }}" = "linux-aarch64" ]; then
            echo "qemu-aarch64-static -L /usr/aarch64-linux-gnu \"$ABS_MAVKA_PATH\" \"\$@\"" >> $WRAPPER_PATH
          else
            echo "\"$ABS_MAVKA_PATH\" \"\$@\"" >> $WRAPPER_PATH
          fi
          chmod +x $WRAPPER_PATH

          echo "Running tests using wrapper: $WRAPPER_PATH"
          bash scripts/test.sh "$WRAPPER_PATH"
